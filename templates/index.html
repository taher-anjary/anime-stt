<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime STT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, input, button {
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      font-variant-ligatures: none;
    }

    html {
      background: #08080b;
      min-height: 100%;
    }

    body {
      background:
        linear-gradient(180deg, rgba(8, 8, 11, 0.32), rgba(8, 8, 11, 0.5)),
        url("/static/img/totoro-bg.gif") center center / cover no-repeat fixed;
      background-color: #08080b;
      color: #e8e8e8;
      font-family: "VT323", "Segoe UI", monospace;
      font-size: 19px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 64px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header h1 {
      font-family: "Press Start 2P", cursive;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 1px;
      line-height: 1.6;
      margin-bottom: 14px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .header h1 span {
      color: #34d399;
    }

    .header p {
      color: #b8b8b8;
      font-size: 17px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: rgba(17, 17, 17, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 3px solid #2c2c2c;
      border-radius: 0;
      padding: 28px 32px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        6px 6px 0 rgba(0, 0, 0, 0.5),
        0 0 0 3px #0a0a0a,
        0 0 0 6px #333;
    }

    .section-label {
      font-family: "Press Start 2P", cursive;
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-family: "Press Start 2P", cursive;
      font-size: 10px;
      color: #999;
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .input-row {
      display: flex;
      gap: 6px;
    }

    input[type="text"],
    input[type="password"] {
      flex: 1;
      background: #0f0f0f;
      border: 2px solid #2a2a2a;
      border-radius: 0;
      color: #e8e8e8;
      font-family: "VT323", monospace;
      font-size: 18px;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      min-width: 0;
      box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.4);
    }

    input:focus {
      border-color: #10b981;
      box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(16, 185, 129, 0.35);
    }

    input::placeholder {
      color: #444;
    }

    .btn {
      background: #10b981;
      border: 2px solid #0a0a0a;
      border-radius: 0;
      color: #fff;
      cursor: pointer;
      font-family: "Press Start 2P", cursive;
      font-size: 11px;
      padding: 11px 14px;
      transition: background 0.15s, opacity 0.15s, transform 0.08s;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
    }

    .btn:hover { background: #059669; }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.6);
    }

    .btn.ghost {
      background: transparent;
      border: 2px solid #2a2a2a;
      color: #aaa;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
    }

    .btn.ghost:hover {
      background: #1e1e1e;
      border-color: #444;
      color: #e8e8e8;
    }

    .btn.ghost.link-btn {
      font-size: 9px;
      padding: 11px 12px;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .divider {
      border: none;
      border-top: 1px solid #1f1f1f;
      margin: 22px 0;
    }

    #generateBtn {
      width: 100%;
      padding: 14px;
      font-size: 13px;
      border-radius: 0;
      margin-top: 4px;
    }

    /* ── Progress ── */
    #progress {
      display: none;
      margin-top: 28px;
    }

    .steps {
      display: flex;
      align-items: flex-start;
      margin-bottom: 24px;
      position: relative;
    }

    .step {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* connector line between dots */
    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 14px;
      left: calc(50% + 14px);
      right: calc(-50% + 14px);
      height: 2px;
      background: #252525;
      z-index: 0;
    }

    .step.done:not(:last-child)::after {
      background: #4ade80;
    }

    .step-dot {
      width: 30px;
      height: 30px;
      border-radius: 0;
      background: #111;
      border: 2px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Press Start 2P", cursive;
      font-size: 11px;
      color: #555;
      transition: all 0.3s;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
    }

    .step.running .step-dot {
      border-color: #10b981;
      color: #10b981;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .step.done .step-dot {
      border-color: #4ade80;
      background: #4ade80;
      color: #000;
    }

    .step.error .step-dot {
      border-color: #f87171;
      background: #f87171;
      color: #000;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50%       { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);  }
    }

    .step-label {
      font-family: "Press Start 2P", cursive;
      font-size: 9px;
      line-height: 1.6;
      color: #555;
      margin-top: 9px;
      text-align: center;
      transition: color 0.3s;
    }

    .step.running .step-label { color: #10b981; }
    .step.done    .step-label { color: #4ade80; }
    .step.error   .step-label { color: #f87171; }

    /* ── Log ── */
    #logWrap {
      background: rgba(10, 10, 10, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid #232323;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 4px 4px 0 rgba(0, 0, 0, 0.5);
    }

    #logHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid #1a1a1a;
    }

    #logHeader span {
      font-family: "Press Start 2P", cursive;
      font-size: 9px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    #logClear {
      font-family: "Press Start 2P", cursive;
      font-size: 9px;
      color: #444;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    #logClear:hover { color: #888; }

    #log {
      padding: 12px 14px;
      height: 220px;
      overflow-y: auto;
      font-family: "VT323", "SFMono-Regular", Consolas, monospace;
      font-size: 17px;
      line-height: 1.5;
    }

    #log:empty::before {
      content: "Waiting for job to start...";
      color: #333;
    }

    .ll { color: #555; }
    .ll.info  { color: #888; }
    .ll.done  { color: #4ade80; }
    .ll.error { color: #f87171; }
    .ll.warn  { color: #fbbf24; }

    a { color: #10b981; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* scrollbar */
    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 0; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Anime <span>STT</span></h1>
    <p>Japanese anime audio &rarr; English SRT subtitles &mdash; powered by Gemini</p>
  </div>

  <div class="card">

    <!-- API Key -->
    <div class="field">
      <label>Gemini API Key</label>
      <div class="input-row">
        <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off" spellcheck="false" />
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" tabindex="-1">
          <button class="btn ghost link-btn" type="button" tabindex="-1">Get Key ↗</button>
        </a>
      </div>
    </div>

    <hr class="divider" />

    <!-- Video File -->
    <div class="field">
      <label>Video File</label>
      <div class="input-row">
        <input type="text" id="videoPath" placeholder="/path/to/episode.mkv" spellcheck="false" />
        <button class="btn ghost" type="button" onclick="browseVideo()">Browse</button>
      </div>
    </div>

    <!-- SRT Output -->
    <div class="field">
      <label>Output SRT Path</label>
      <div class="input-row">
        <input type="text" id="srtPath" placeholder="auto-filled when you pick a video" spellcheck="false" />
        <button class="btn ghost" type="button" onclick="browseSrt()">Browse</button>
      </div>
    </div>

    <button class="btn" id="generateBtn" onclick="generate()">Generate Subtitles</button>

  </div>

  <!-- Progress (shown after first run) -->
  <div id="progress" style="width:100%;max-width:620px;">

    <div class="steps">
      <div class="step" id="step-audio">
        <div class="step-dot">1</div>
        <div class="step-label">Extract Audio</div>
      </div>
      <div class="step" id="step-upload">
        <div class="step-dot">2</div>
        <div class="step-label">Upload</div>
      </div>
      <div class="step" id="step-waiting">
        <div class="step-dot">3</div>
        <div class="step-label">Waiting</div>
      </div>
      <div class="step" id="step-transcribe">
        <div class="step-dot">4</div>
        <div class="step-label">Transcribe (JA)</div>
      </div>
      <div class="step" id="step-translate">
        <div class="step-dot">5</div>
        <div class="step-label">Translate (EN)</div>
      </div>
      <div class="step" id="step-srt_fix">
        <div class="step-dot">6</div>
        <div class="step-label">Fix Timestamps</div>
      </div>
    </div>

    <div id="logWrap">
      <div id="logHeader">
        <span>Log</span>
        <button id="logClear" onclick="clearLog()">clear</button>
      </div>
      <div id="log"></div>
    </div>

  </div>

  <script>
    const ALL_STEPS = ['audio', 'upload', 'waiting', 'transcribe', 'translate', 'srt_fix'];
    const STEP_NUMS = { audio: '1', upload: '2', waiting: '3', transcribe: '4', translate: '5', srt_fix: '6' };

    async function browseVideo() {
      try {
        const res = await fetch('/browse/video');
        const data = await res.json();
        if (data.error) { log('Browse unavailable: ' + data.error + ' — type path manually.', 'warn'); return; }
        if (data.path) {
          document.getElementById('videoPath').value = data.path;
          document.getElementById('srtPath').value = data.srt_path;
        }
      } catch (e) {
        log('Browse failed: ' + e.message, 'error');
      }
    }

    async function browseSrt() {
      try {
        const res = await fetch('/browse/srt');
        const data = await res.json();
        if (data.error) { log('Browse unavailable: ' + data.error + ' — type path manually.', 'warn'); return; }
        if (data.path) document.getElementById('srtPath').value = data.path;
      } catch (e) {
        log('Browse failed: ' + e.message, 'error');
      }
    }

    function clearLog() {
      document.getElementById('log').innerHTML = '';
    }

    function log(msg, cls = 'info') {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.className = 'll ' + cls;
      // Timestamp prefix
      const now = new Date();
      const ts = now.toTimeString().slice(0, 8);
      line.textContent = ts + '  ' + msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function setStep(step, status) {
      const el = document.getElementById('step-' + step);
      if (!el) return;
      el.classList.remove('running', 'done', 'error');
      if (status) el.classList.add(status);
      const dot = el.querySelector('.step-dot');
      if (status === 'done')  dot.textContent = '✓';
      else if (status === 'error') dot.textContent = '✗';
      else dot.textContent = STEP_NUMS[step] || '?';
    }

    function resetSteps() {
      ALL_STEPS.forEach(s => setStep(s, null));
    }

    async function generate() {
      const apiKey    = document.getElementById('apiKey').value.trim();
      const videoPath = document.getElementById('videoPath').value.trim();
      const srtPath   = document.getElementById('srtPath').value.trim();

      if (!apiKey)    { alert('Please enter your Gemini API key.'); return; }
      if (!videoPath) { alert('Please enter or browse for the video file path.'); return; }
      if (!srtPath)   { alert('Please enter the output SRT path.'); return; }

      document.getElementById('progress').style.display = 'block';
      clearLog();
      resetSteps();
      document.getElementById('generateBtn').disabled = true;

      let jobId;
      try {
        const res = await fetch('/generate/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_key: apiKey, video_path: videoPath, srt_path: srtPath }),
        });
        const data = await res.json();
        if (!res.ok) {
          (data.errors || ['Failed to start job.']).forEach(e => log('ERROR: ' + e, 'error'));
          document.getElementById('generateBtn').disabled = false;
          return;
        }
        jobId = data.job_id;
      } catch (e) {
        log('Failed to start job: ' + e.message, 'error');
        document.getElementById('generateBtn').disabled = false;
        return;
      }

      const es = new EventSource('/generate/stream?job_id=' + encodeURIComponent(jobId));

      es.onmessage = function(e) {
        const msg = JSON.parse(e.data);

        if (msg.type === 'step') {
          setStep(msg.step, msg.status);
        } else if (msg.type === 'log') {
          log(msg.message);
        } else if (msg.type === 'done') {
          log(msg.message, 'done');
          es.close();
          document.getElementById('generateBtn').disabled = false;
        } else if (msg.type === 'error') {
          log('ERROR: ' + msg.message, 'error');
          // Mark whichever step is currently running as errored
          ALL_STEPS.forEach(s => {
            if (document.getElementById('step-' + s).classList.contains('running')) {
              setStep(s, 'error');
            }
          });
          es.close();
          document.getElementById('generateBtn').disabled = false;
        }
      };

      es.onerror = function() {
        log('Connection lost. The server may have stopped.', 'error');
        es.close();
        document.getElementById('generateBtn').disabled = false;
      };
    }
  </script>

</body>
</html>
